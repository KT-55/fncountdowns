<script>
document.addEventListener('DOMContentLoaded', () => {
  const timersContainer = document.getElementById('timers');
  let timers = [];
  let serverNowUTC = null;
  let lastSync = null;

  // Fetch accurate UTC from worldtimeapi.org
  async function syncUTC() {
    try {
      const res = await fetch("https://worldtimeapi.org/api/timezone/Etc/UTC");
      const data = await res.json();
      serverNowUTC = new Date(data.utc_datetime);
      lastSync = Date.now();
      console.log("Synced UTC:", serverNowUTC);
    } catch (e) {
      console.warn("UTC sync failed, using local clock as fallback:", e);
      serverNowUTC = new Date(); // fallback
      lastSync = Date.now();
    }
  }

  function getAccurateNowUTC() {
    if (!serverNowUTC || !lastSync) return new Date();
    const elapsed = Date.now() - lastSync;
    return new Date(serverNowUTC.getTime() + elapsed);
  }

  function renderTimers() {
    timersContainer.innerHTML = '';
    timers.sort((a,b)=>new Date(a.date)-new Date(b.date));

    timers.forEach(timer=>{
      const card=document.createElement('div');
      card.className='timer-card';

      if(timer.image){
        const img=document.createElement('img');
        img.src=timer.image;
        img.className='timer-image';
        card.appendChild(img);
      }

      const title=document.createElement('div');
      title.className='timer-title';
      title.textContent=timer.title;
      card.appendChild(title);

      const countdown=document.createElement('div');
      countdown.className='timer-countdown';
      card.appendChild(countdown);

      const buttons=document.createElement('div');
      buttons.className='timer-buttons';
      if(timer.buttons){
        timer.buttons.forEach(b=>{
          const link=document.createElement('a');
          link.href=b.url;
          link.target="_blank";
          link.textContent=b.label;
          buttons.appendChild(link);
        });
      }
      card.appendChild(buttons);
      timersContainer.appendChild(card);

      function updateCountdown(){
        const now = getAccurateNowUTC(); // use synced UTC
        const target = new Date(timer.date); // UTC-based
        const diff = target - now;
        if(diff <= 0){countdown.textContent="LIVE!"; return;}
        const days = Math.floor(diff/(1000*60*60*24));
        const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        const minutes = Math.floor((diff%(1000*60*60))/(1000*60));
        const seconds = Math.floor((diff%(1000*60))/1000);
        countdown.textContent=`${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      updateCountdown();
      setInterval(updateCountdown,1000);
    });
  }

  async function loadTimers() {
    try {
      const url = 'https://raw.githubusercontent.com/KT-55/fncountdowns/main/timers.json?t=' + new Date().getTime();
      const res = await fetch(url);
      if(!res.ok) throw new Error("Failed to fetch timers.json");
      const newTimers = await res.json();
      if(JSON.stringify(newTimers) !== JSON.stringify(timers)){
        timers = newTimers;
        renderTimers();
      }
    } catch(e){
      console.error("Failed to load timers:", e);
    }
  }

  // Run
  (async ()=>{
    await syncUTC();       // fetch accurate time once
    await loadTimers();    // load events
    setInterval(loadTimers, 5000);   // refresh timers.json
    setInterval(syncUTC, 60000);     // re-sync UTC every 60s
  })();
});
</script>
