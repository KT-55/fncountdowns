<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite Event Countdown</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<style>
  body { font-family: 'Arial Black', Arial, sans-serif; background-color:#1a1a1a; color:#fff; margin:0; padding:0; }
  h1,h2 { text-align:center; margin:1rem 0; }
  h1 { font-size:2rem; text-transform:uppercase; }
  h2 { font-size:1.5rem; margin-bottom:2rem; }
  .countdown-container { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; padding:1rem; }
  .timer-card { background:#222; border-radius:12px; width:280px; overflow:hidden; text-align:center; transition: transform 0.3s, box-shadow 0.3s; }
  .timer-card:hover { transform:scale(1.05); box-shadow:0 0 20px #ffcc00; }
  .timer-image { width:100%; height:160px; object-fit:cover; }
  .timer-title { font-size:1.2rem; font-weight:bold; margin:0.5rem 0; }
  .timer-countdown { font-size:1.2rem; margin-bottom:0.5rem; }
  .timer-buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.5rem; }
  .timer-buttons a { background:#ffcc00; padding:0.5rem 1rem; font-weight:bold; border-radius:5px; text-decoration:none; color:#000; transition: background 0.3s; }
  .timer-buttons a:hover { background:#ffd633; }
  .add-timer { display:block; margin:2rem auto; padding:0.5rem 1rem; font-size:1rem; border:none; border-radius:10px; cursor:pointer; background:#ff4a4a; color:#fff; transition: background 0.3s; }
  .add-timer:hover { background:#ff7676; }
  input, select { width:100%; margin-bottom:0.5rem; padding:0.5rem; border-radius:8px; border:none; }
  .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:10; }
  .modal-content { background:#222; padding:2rem; border-radius:15px; max-width:400px; width:90%; }
  .close { float:right; cursor:pointer; font-size:1.2rem; }
  .button-row { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.5rem; }
</style>
</head>
<body>

<h1>Previous Fortnite Seasons</h1>
<h2>Chapter 6</h2>

<div class="countdown-container" id="timers"></div>
<button class="add-timer" id="openModal">Add Timer</button>

<div class="modal" id="timerModal">
  <div class="modal-content">
    <span class="close" id="closeModal">&times;</span>
    <h2>Add New Event</h2>
    <input type="text" id="eventTitle" placeholder="Event Title">
    <input type="datetime-local" id="eventDate">
    <input type="text" id="eventImage" placeholder="Image URL (optional)">
    <h3>Optional Buttons</h3>
    <div id="buttonContainer"></div>
    <button id="addButton">Add Button</button>
    <button id="saveTimer">Save Timer</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const modal = document.getElementById('timerModal');
  const openModalBtn = document.getElementById('openModal');
  const closeModalBtn = document.getElementById('closeModal');
  const saveTimerBtn = document.getElementById('saveTimer');
  const addButtonBtn = document.getElementById('addButton');
  const timersContainer = document.getElementById('timers');
  const buttonContainer = document.getElementById('buttonContainer');

  let timers = [];

  // Fetch timers from GitHub JSON
  async function loadTimers() {
    const res = await fetch('timers.json');
    timers = await res.json();
    renderTimers();
  }

  function mstDate(dateStr) {
    let date = new Date(dateStr);
    let utc = date.getTime() + date.getTimezoneOffset() * 60000;
    return new Date(utc - 7 * 60 * 60000);
  }

  function renderTimers() {
    timersContainer.innerHTML = '';
    timers.forEach(timer => {
      const card = document.createElement('div');
      card.className = 'timer-card';

      if(timer.image) {
        const img = document.createElement('img');
        img.src = timer.image;
        img.className = 'timer-image';
        card.appendChild(img);
      }

      const title = document.createElement('div');
      title.className = 'timer-title';
      title.textContent = timer.title;
      card.appendChild(title);

      const countdown = document.createElement('div');
      countdown.className = 'timer-countdown';
      card.appendChild(countdown);

      const buttons = document.createElement('div');
      buttons.className = 'timer-buttons';
      if(timer.buttons) {
        timer.buttons.forEach(b => {
          const link = document.createElement('a');
          link.href = b.url;
          link.target = "_blank";
          link.textContent = b.label;
          buttons.appendChild(link);
        });
      }
      card.appendChild(buttons);

      timersContainer.appendChild(card);

      function updateCountdown() {
        const now = new Date();
        const eventDate = mstDate(timer.date);
        let diff = eventDate - now;

        if(diff <= 0) {
          countdown.textContent = "LIVE!";
          clearInterval(interval);
          return;
        }

        let days = Math.floor(diff / (1000*60*60*24));
        let hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        let minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
        let seconds = Math.floor((diff % (1000*60)) / 1000);

        countdown.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      updateCountdown();
      const interval = setInterval(updateCountdown, 1000);
    });
  }

  function clearButtonInputs() {
    buttonContainer.innerHTML = '';
  }

  openModalBtn.addEventListener('click', () => {
    modal.style.display = 'flex';
    clearButtonInputs();
  });

  closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
  window.addEventListener('click', e => { if(e.target == modal) modal.style.display = 'none'; });

  addButtonBtn.addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'button-row';
    row.innerHTML = `<input type="text" placeholder="Button Label"><input type="text" placeholder="Button URL">`;
    buttonContainer.appendChild(row);
  });

  saveTimerBtn.addEventListener('click', () => {
    const title = document.getElementById('eventTitle').value.trim();
    const date = document.getElementById('eventDate').value;
    const image = document.getElementById('eventImage').value.trim();
    if(!title || !date) return alert('Title and Date are required!');

    const buttons = Array.from(buttonContainer.children).map(row => {
      const inputs = row.querySelectorAll('input');
      return { label: inputs[0].value.trim(), url: inputs[1].value.trim() };
    }).filter(b => b.label && b.url);

    timers.push({title, date, image, buttons});
    alert('Now use Python to update timers.json on GitHub!');
    modal.style.display = 'none';
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventImage').value = '';
    clearButtonInputs();
    renderTimers();
  });

  loadTimers();
});
</script>
</body>
</html>
